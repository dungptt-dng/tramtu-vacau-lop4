<title>Vương quốc Từ hay – Câu đẹp Lớp 4</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&family=Lexend:wght@400;500;600&display=swap"><style id="tc-style">/* Giao diện học sinh: nền trời xanh nhạt, thẻ trắng bo tròn, nút vàng – xanh, linh vật rô-bốt Bíp; mỗi chủ điểm một màu; câu hỏi đặt trên trang vở ô li. Màn khởi động giữ bộ màu riêng (.sp-stage). */
:root{
  --bg:#EAF4FF; --surface:#FFFFFF; --surface-2:#F6F9FF; --ink:#1B2340; --ink-2:#3B4664; --muted:#55607A;
  --line:#DCE6F5; --line-2:#C9D8F0; --margin:#F08A9B; --rule:#D5E1F2;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#DAE9FB; --accent-deep:#163D9E; --hero:#2457D6; --hero-meta:#DCE6FF;
  --sun:#FFC93C; --sun-deep:#C98F00; --sun-soft:#FFF3C9; --sun-pale:#FFF6D6; --sun-ink:#6B4800; --on-sun:#1B2340;
  --ok:#167F49; --ok-2:#1E9E5A; --ok-soft:#DDF2E2; --ok-line:#A7DDB9; --ok-ink:#0E5C34;
  --bad:#B83A0A; --bad-soft:#FCE8DD; --bad-line:#F3B08C; --bad-ink:#8F2E07;
  --hint-soft:#ECE1FB; --hint-line:#C7AEF0; --hint-ink:#5B2DA8;
  --star:#F5B400; --star-off:#DCE3EF; --off:#B9C4D8; --lock-bg:#F1F4F9; --night:#1B2340;
  --m1:#1E9E5A; --m2:#2F6FDB; --m3:#E8641E; --m1-ink:#167F49; --m2-ink:#2457D6; --m3-ink:#A8420E;
  --m1-soft:#DDF2E2; --m2-soft:#DAE9FB; --m3-soft:#FFE7D8; --m1-line:#A7DDB9; --m2-line:#2F6FDB; --m3-line:#F3B08C;
  --shadow:0 4px 0 var(--line-2);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Baloo 2","Nunito",system-ui,sans-serif;
  --r:20px;
}

  --bg:#0F1629; --surface:#1A2340; --surface-2:#151D36; --ink:#EEF3FF; --ink-2:#C5CEE6; --muted:#A3AECB;

/* Màn khởi động giữ bộ màu, phông và nút cũ */
.sp-stage{--bg:#F5F3FA; --surface:#FFFFFF; --ink:#231B3B; --muted:#625B7C; --line-2:#C4BADF; --accent:#5B3CC4; --accent-ink:#FFFFFF;
  --f-display:"Baloo 2","Lexend",system-ui,sans-serif; --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-family:var(--f-body);font-size:17px;line-height:1.55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sp-stage{--bg:#141C18; --surface:#1C2621; --ink:#EDF2EE; --muted:#A2B1A8; --line-2:#3E5047; --accent:#B6A2FF; --accent-ink:#1B1433}}
:root[data-theme="dark"] .sp-stage{--bg:#141C18; --surface:#1C2621; --ink:#EDF2EE; --muted:#A2B1A8; --line-2:#3E5047; --accent:#B6A2FF; --accent-ink:#1B1433}
.sp-stage .btn{min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:1rem;box-shadow:none}
.sp-stage .btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem;border-radius:10px}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;font-weight:600;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:800}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 .2em;font-weight:900}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.boot{padding:40px 0;text-align:center;color:var(--muted)}

/* Đầu trang */
.top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding-block:4px 16px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:46px;height:46px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.8rem;font-weight:700;margin-top:3px}
.top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-hs{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 4px 4px 4px;box-shadow:0 3px 0 var(--line-2);min-width:0}
.chip-hs .ava{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1}
.chip-hs .hi{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.chip-hs .hi small{font-size:.75rem;color:var(--muted);font-weight:800}
.chip-hs b{font-family:var(--f-display);font-size:1.12rem;line-height:1.05;max-width:13em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-hs .btn{min-height:38px;border-radius:999px;padding:4px 12px;font-size:.85rem;background:var(--accent-soft);color:var(--accent-deep);border:0;box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:16px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:900;text-decoration:none;transition:transform .08s ease;box-shadow:0 3px 0 var(--line-2)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm{min-height:38px;padding:4px 14px;font-size:.88rem;border-radius:12px;box-shadow:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.12rem;box-shadow:0 4px 0 var(--accent-deep)}
.btn.go{background:var(--sun);border-color:var(--sun);color:var(--on-sun);font-family:var(--f-display);font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--sun-deep)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#FFFFFF;font-family:var(--f-display);font-weight:800;font-size:1.08rem;box-shadow:0 4px 0 var(--ok-ink)}
.btn.big{min-height:58px;border-radius:18px;font-size:1.25rem;padding:10px 22px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{color:var(--ink)}
.btn.hint{background:var(--hint-soft);border-color:var(--hint-line);color:var(--hint-ink);box-shadow:none}
.btn.pill{border-radius:999px;min-height:44px;padding:4px 16px 4px 10px;box-shadow:none;font-size:.95rem}
.btn[disabled]{cursor:not-allowed;background:var(--off);border-color:var(--off);color:var(--ink-2);box-shadow:none;opacity:1}
.btn.ghost[disabled],.btn.sm[disabled]{opacity:.45;background:transparent;border-color:transparent}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--line-2);flex:none}
.icon-btn svg{width:22px;height:22px}

.sp-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(460px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);color:var(--ink);border:2px solid var(--line-2);border-radius:20px;box-shadow:0 18px 40px rgba(20,40,107,.35);padding:20px 22px}
.sp-panel h3{font-family:var(--f-display);font-size:1.5rem;line-height:1.2;margin:0 0 10px;color:var(--accent)}
.sp-panel h3:focus{outline:none}
.sp-panel ol{margin:0 0 14px;padding-left:1.3em}
.sp-panel li+li{margin-top:6px}
.sp-panel p{margin:0 0 10px}
.sp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sp-row .sp{flex:1}
.sp-end{display:flex;justify-content:flex-end}
@media (max-width:899px){.sp-panel{position:fixed;z-index:30;max-height:calc(100% - 48px)}}

/* Màu chủ điểm: mỗi khối đặt --t (đậm), --tl (nhạt), --td (rất đậm) ngay trên thẻ; --ts là màu nhạt dùng thật (đổi theo chế độ tối) */
.th{--ts:var(--tl,var(--accent-soft))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .th{--ts:color-mix(in srgb,var(--t) 26%,var(--surface));--tink:#FFFFFF}}
:root[data-theme="dark"] .th{--ts:color-mix(in srgb,var(--t) 26%,var(--surface));--tink:#FFFFFF}
.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.robot-svg{flex:none}

/* Trang chủ */
.hello{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:28px;align-items:start}
@media (max-width:760px){.hello{grid-template-columns:1fr}}
.now{position:relative;overflow:hidden;background:var(--hero);color:#FFFFFF;border-radius:28px;padding:18px 18px 20px;box-shadow:0 6px 0 var(--accent-deep);display:flex;flex-direction:column;gap:12px;min-width:0}
.now::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;right:-60px}
.now>*{position:relative}
.now .tag-sun{align-self:flex-start;background:var(--sun);color:var(--on-sun);font-size:.8rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.now .hero-row{display:flex;gap:12px;align-items:flex-start}
.now .hero-row>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.now h2{font-family:var(--f-display);font-weight:800;font-size:1.95rem;line-height:1.08;margin:0;text-wrap:balance}
.now .meta{color:var(--hero-meta);font-size:.95rem;font-weight:700}
.now .robot-svg{width:72px;height:72px}
.now .tchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--ts);color:var(--tink,var(--td));font-size:.85rem;font-weight:900;padding:5px 12px;border-radius:999px}
.hero-lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-lv div{background:rgba(255,255,255,.14);border-radius:16px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.hero-lv span{font-size:.82rem;font-weight:900;line-height:1.15}
.hero-lv .stars svg{width:18px;height:18px}
.hero-lv .stars .off{fill:rgba(255,255,255,.3)}
.now .btn.go{width:100%}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tally div{background:var(--surface);border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);text-align:center}
.tally i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.tally i svg{width:22px;height:22px}
.tally i.s{background:var(--sun-soft)}.tally i.v{background:var(--accent-soft)}.tally i.l{background:var(--ok-soft)}
.tally b{font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:.8rem;color:var(--muted);font-weight:800;line-height:1.2}
.sendcard{background:var(--surface);border-radius:22px;padding:14px 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sendcard h3{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.15}
.sendcard p{margin:0;color:var(--muted);font-size:.92rem;font-weight:700}
.sendcard .btn{width:100%}

.journey-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:6px 0 10px}
.journey-head h2{font-family:var(--f-display);font-size:1.75rem;line-height:1.1;margin:0}
.seg{display:inline-flex;background:var(--surface);border:2px solid var(--line-2);border-radius:999px;padding:3px;gap:2px}
.seg button{min-height:40px;padding:4px 16px;border-radius:999px;border:0;background:transparent;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lv-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.85rem;font-weight:800;color:var(--muted);margin-bottom:16px}
.lv-legend span{display:inline-flex;align-items:center;gap:6px}
.lv-legend i{width:12px;height:12px;border-radius:50%}
.lv-legend i.m1{background:var(--m1)}.lv-legend i.m2{background:var(--m2)}.lv-legend i.m3{background:var(--m3)}
.term{margin:0 0 6px;color:var(--muted);font-size:.9rem;font-weight:800}
.theme-row{margin:18px 0 10px;display:flex;align-items:center;gap:12px;background:var(--t);color:#FFFFFF;border-radius:18px;padding:10px 16px;box-shadow:0 4px 0 var(--td)}
.theme-row small{display:block;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.theme-row h3{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.theme-row .cnt{margin-left:auto;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:900;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tile{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line-2);border-radius:var(--r);padding:12px 14px;min-height:84px;box-shadow:0 3px 0 var(--line-2);width:100%}
.tile{--t:var(--accent);--td:var(--accent-deep)}
.tile:hover{border-color:var(--t)}
.tile.rev:hover{border-color:var(--sun-deep)}
.tile .wk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:var(--ts);color:var(--tink,var(--td))}
.tile.done .wk{background:var(--t);color:#FFFFFF}
.tile.cur{border:3px solid var(--sun-deep);box-shadow:0 4px 0 var(--sun-deep);padding-top:20px}
.tile.cur .wk{background:var(--sun);color:var(--on-sun)}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile .bi{font-size:.8rem;color:var(--muted);font-weight:800}
.tile .nm{font-weight:900;line-height:1.25;font-size:1.02rem}
.tile .go{flex:none;color:var(--muted)}
.tile .go svg{width:22px;height:22px;display:block}
.tile.rev{background:var(--sun-pale);border:2px dashed var(--sun-deep);box-shadow:none}
.tile.rev .wk{background:var(--sun);color:var(--on-sun)}
.tile.rev .wk svg{width:22px;height:22px}
.tile .badge{position:absolute;top:-11px;left:14px;background:var(--sun);color:var(--on-sun);font-size:.75rem;font-weight:900;padding:2px 10px;border-radius:999px;border:2px solid var(--surface)}
.rbadge{align-self:flex-start;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:900;color:var(--sun-ink)}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;background:var(--star-off)}
.pip.m1.on{background:var(--m1)}.pip.m2.on{background:var(--m2)}.pip.m3.on{background:var(--m3)}
.pips small{margin-left:4px;font-size:.78rem;font-weight:900;color:var(--muted)}

/* Bài học */
.back{margin:0 0 12px;display:flex;align-items:center;gap:10px}
.back svg{width:20px;height:20px}
.lesson-head{position:relative;overflow:hidden;background:var(--t);color:#FFFFFF;border-radius:28px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 var(--td);margin-bottom:22px}
.lesson-head::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09);top:-64px;right:-50px}
.lesson-head>*{position:relative}
.lesson-head .lchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;color:var(--td);font-size:.82rem;font-weight:900;padding:5px 12px;border-radius:999px}
.lesson-head .lchip svg{width:16px;height:16px}
.lesson-head h2{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1.05;margin:0;text-wrap:balance}
.lesson-head .meta{display:flex;flex-wrap:wrap;gap:6px}
.lesson-head .meta span{background:var(--td);padding:4px 10px;border-radius:999px;font-size:.85rem;font-weight:800}
.lesson-head.rev{--t:#FFC93C;--td:#C98F00;color:var(--on-sun);box-shadow:0 6px 0 var(--sun-deep)}
.lesson-head.rev .meta span{background:rgba(255,255,255,.55);color:var(--on-sun)}
.lesson-head.rev .lchip{color:var(--sun-ink)}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.lesson-grid{grid-template-columns:1fr}}
.lcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.note{position:relative;margin-top:10px;background-color:var(--surface);background-image:repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);border:2px solid var(--line-2);border-radius:24px;padding:26px 16px 16px}
.note h3{position:absolute;top:-17px;left:16px;margin:0;display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--on-sun);font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1;padding:7px 14px 6px 10px;border-radius:999px;border:2px solid var(--surface)}
.note h3 svg{width:18px;height:18px}
.note ol,.note ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.note li{display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.note li .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--t);color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;margin-top:1px}
.note li>span:last-child{min-width:0}
.bubble-row{display:flex;align-items:flex-end;gap:8px}
.bubble-row .robot-svg{width:62px;height:62px}
.bubble{flex:1;min-width:0;background:var(--hint-soft);border-radius:20px 20px 20px 6px;padding:10px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px;white-space:pre-line;line-height:1.45}
.bubble b{font-family:var(--f-display);font-weight:800;font-size:1.08rem;color:var(--hint-ink)}
.tip-best{display:flex;align-items:center;gap:10px;background:var(--sun-soft);border-radius:18px;padding:10px 14px;font-weight:800;color:var(--sun-ink)}
.tip-best b{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.levels{display:flex;flex-direction:column;gap:14px}
.lv-head h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1}
.lv-head span{font-size:.9rem;font-weight:700;color:var(--muted)}
.lvl{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--ml);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--ml);width:100%;color:var(--ink)}
.lvl.m1{--mc:var(--m1);--mi:var(--m1-ink);--ms:var(--m1-soft);--ml:var(--m1-line)}
.lvl.m2{--mc:var(--m2);--mi:var(--m2-ink);--ms:var(--m2-soft);--ml:var(--m2-line)}
.lvl.m3{--mc:var(--m3);--mi:var(--m3-ink);--ms:var(--m3-soft);--ml:var(--m3-line)}
.lvl .ic{flex:none;width:58px;height:58px;border-radius:18px;background:var(--ms);display:grid;place-items:center}
.lvl .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lvl .ln{font-family:var(--f-display);font-weight:800;font-size:1.22rem;line-height:1.1;color:var(--mi)}
.lvl .ld{font-size:.88rem;color:var(--muted);font-weight:700}
.lvl .lk{font-size:.82rem;color:var(--ink-2);font-weight:800;margin-top:2px}
.lvl .act{flex:none;display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border-radius:13px;background:var(--ms);color:var(--mi);font-weight:900;font-size:.9rem}
.lvl.next{border:3px solid var(--mc);box-shadow:0 4px 0 var(--mi)}
.lvl.next .act{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.lvl .flag{position:absolute;top:-12px;left:16px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:900;padding:3px 10px;border-radius:999px}
.lvl[disabled]{background:var(--lock-bg);border:2px dashed var(--off);box-shadow:none;cursor:not-allowed}
.lvl[disabled] .act{width:44px;height:44px;padding:0;border-radius:50%;background:var(--surface);justify-content:center;color:var(--ink-2)}
.lvl .act svg{width:22px;height:22px}
.lvl-icon{width:40px;height:40px}
.lvl .stars{margin-top:2px}
.stars{display:inline-flex;gap:2px;align-items:flex-end}
.stars svg{width:20px;height:20px}
.stars .on{fill:var(--star)}.stars .off{fill:var(--star-off)}
.stars.big{gap:4px}
.stars.big svg{width:54px;height:54px}
.stars.big svg:nth-child(2){width:70px;height:70px}
.stars.big .on{stroke:var(--sun-deep);stroke-width:1;stroke-linejoin:round}
.mode-note{font-size:.88rem;color:var(--muted);font-weight:700;margin:-4px 4px 0}

/* Câu hỏi */
.quiz{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qbar{display:flex;align-items:center;gap:10px}
.qbar .btn.pill{padding:4px 14px 4px 10px;min-height:44px;background:var(--surface)}
.qbar .btn.pill svg{width:18px;height:18px}
.qbar>b{flex:none;font-family:var(--f-display);font-size:1.3rem;line-height:1}
.qbar .icon-btn{width:44px;height:44px;box-shadow:none}
.dots{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;min-width:0}
.dots i{display:block;height:12px;border-radius:99px;background:var(--line-2)}
.dots i.ok{background:var(--m1)}.dots i.half{background:var(--star)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}.dots i.w{background:var(--hint-ink)}
.qcard{background:var(--surface);border-radius:26px;padding:16px;box-shadow:0 4px 0 var(--line-2);display:flex;flex-direction:column;gap:14px}
.qtag{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.82rem;font-weight:800;color:var(--muted)}
.qtag .lv{color:#FFFFFF;background:var(--m1-ink);padding:3px 10px;border-radius:999px;font-weight:900}
.qtag .lv.m2{background:var(--m2-ink)}.qtag .lv.m3{background:var(--m3-ink)}.qtag .lv.m0{background:var(--sun-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qtag .lv{color:var(--accent-ink)}}
:root[data-theme="dark"] .qtag .lv{color:var(--accent-ink)}
.qtag .ty{background:var(--bg);color:var(--ink-2);padding:3px 10px;border-radius:999px}
.qp{font-size:1.28rem;font-weight:900;line-height:1.38;margin:0;white-space:pre-line;text-wrap:pretty}
.robot{display:flex;gap:12px;align-items:center;background:var(--night);color:#FFFFFF;border-radius:20px;padding:10px 14px}
.robot svg{width:52px;height:52px;flex:none}
.robot span{font-size:.92rem;font-weight:700;line-height:1.4}
.robot b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#FFC93C}
/* Trang vở ô li */
.vo{position:relative;padding:10px 14px 10px 38px;border-radius:14px;border:1.5px solid var(--line-2);font-size:1.25rem;font-weight:700;line-height:40px;white-space:pre-line;
  background-color:var(--surface-2);
  background-image:linear-gradient(90deg,transparent 24px,var(--margin) 24px,var(--margin) 26px,transparent 26px),repeating-linear-gradient(180deg,transparent 0,transparent 39px,var(--rule) 39px,var(--rule) 40px);
  background-position:0 0,0 10px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:8px 12px 8px 10px;border-radius:20px;border:3px solid var(--line-2);background:var(--surface);font-size:1.1rem;font-weight:800;white-space:pre-line;box-shadow:0 4px 0 var(--line-2);color:var(--ink)}
.opts.two .opt{font-size:1.25rem}
.opt>span:nth-child(2){flex:1;min-width:0}
.opt .k{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:var(--accent-soft);color:var(--accent-deep)}
.opt:nth-child(4n+2) .k{background:var(--ok-soft);color:var(--ok)}
.opt:nth-child(4n+3) .k{background:var(--m3-soft);color:var(--m3-ink)}
.opt:nth-child(4n+4) .k{background:var(--hint-soft);color:var(--hint-ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--line-2)}
.opt.bad{border-color:var(--bad-line);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad-line)}
.opt.bad .k{background:var(--bad);color:#FFFFFF}
.opt.good{border-color:var(--ok-2);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok-2)}
.opt.good .k{background:var(--ok);color:#FFFFFF}
.opt .mk{flex:none;width:24px;height:24px}
.opt .mk svg{width:100%;height:100%;display:block}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
.toks{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center;padding:12px;border-radius:18px;background:var(--surface-2);border:1.5px solid var(--line-2)}
.tok{min-height:50px;padding:6px 14px;border-radius:14px;border:2.5px solid var(--line-2);background:var(--surface);font-size:1.2rem;font-weight:800;line-height:1.2;box-shadow:0 3px 0 var(--line-2);color:var(--ink)}
.tok.p{min-width:50px;font-weight:900}
.tok.on{border-color:var(--sun-deep);background:var(--sun-soft);box-shadow:0 3px 0 var(--sun-deep);transform:translateY(-2px)}
.tok.good{border-color:var(--ok-2);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok-2);transform:none}
.tok.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);transform:none}
.tok.miss{border-style:dashed;border-color:var(--ok-2);box-shadow:none}
.punct{font-size:1.25rem;font-weight:900;margin-left:-6px;color:var(--muted)}
.br{flex-basis:100%;height:0}
.qhelp{display:flex;gap:8px;align-items:center;font-size:.92rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:8px 10px;margin:0}
.qhelp::before{content:"?";flex:none;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem}
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:76px;padding:12px;border-radius:20px;border:2.5px dashed var(--line-2);background:var(--surface-2)}
.tray:empty::before{content:"Đã xếp hết thẻ. Em bấm Kiểm tra nhé!";color:var(--muted);font-size:.92rem;font-weight:800;align-self:center}
.card{min-height:52px;padding:8px 18px;border-radius:16px;border:2.5px solid var(--line-2);background:var(--surface);font-size:1.2rem;font-weight:800;text-align:left;box-shadow:0 3px 0 var(--line-2);max-width:100%;white-space:pre-line;color:var(--ink)}
.card.sel{border-color:var(--sun-deep);background:var(--sun-soft);transform:translateY(-3px);box-shadow:0 5px 0 var(--sun-deep)}
.card.good{border-color:var(--ok-2);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok-2)}
.card.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{display:flex;flex-direction:column;gap:10px;text-align:left;min-height:132px;padding:12px;border-radius:20px;border:2.5px solid var(--bc,var(--line-2));background:var(--bs,var(--surface))}
.bin:nth-child(3n+1){--bc:var(--m2-line);--bs:var(--m2-soft);--bi:var(--m2-ink)}
.bin:nth-child(3n+2){--bc:var(--hint-line);--bs:var(--hint-soft);--bi:var(--hint-ink)}
.bin:nth-child(3n+3){--bc:var(--ok-line);--bs:var(--ok-soft);--bi:var(--ok)}
.bin.ready{border-style:dashed;box-shadow:0 0 0 3px var(--sun)}
.bin h4{margin:0;font-family:var(--f-display);font-size:1.08rem;font-weight:800;color:var(--bi,var(--ink))}
.bin .in{display:flex;flex-wrap:wrap;gap:8px}
.tray .card:not([disabled]),.bin .card:not([disabled]){touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:50;margin:0;pointer-events:none;cursor:grabbing;border-color:var(--sun-deep);background:var(--sun-soft);transform:rotate(-3deg) scale(1.05);box-shadow:0 12px 24px rgba(0,0,0,.18)}
.is-dragging .bin{border-style:dashed}
.bin.over,.tray.over{border-style:solid;box-shadow:0 0 0 4px var(--sun)}
.tf{display:flex;flex-direction:column;gap:10px}
.tfrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 14px;padding:12px;border-radius:18px;border:2.5px solid var(--line-2);background:var(--surface);box-shadow:0 3px 0 var(--line-2)}
.tfrow.good{border-color:var(--ok-2);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok-2)}
.tfrow.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.tfs{flex:1 1 240px;font-size:1.1rem;font-weight:700}
.tfbtns{display:flex;gap:8px}
.tfb{min-width:84px;min-height:48px;border-radius:14px;border:2.5px solid var(--line-2);background:var(--surface-2);font-weight:900;font-size:1.02rem;color:var(--ink)}
.tfb:first-child.on{border-color:var(--ok);background:var(--ok);color:#FFFFFF}
.tfb:last-child.on{border-color:var(--bad);background:var(--bad);color:#FFFFFF}
.tfb.key{box-shadow:0 0 0 3px var(--sun)}
.vo.fill{line-height:52px;background-image:linear-gradient(90deg,transparent 24px,var(--margin) 24px,var(--margin) 26px,transparent 26px),repeating-linear-gradient(180deg,transparent 0,transparent 51px,var(--rule) 51px,var(--rule) 52px)}
.blank{box-sizing:border-box;max-width:100%;height:1.9em;margin:0 4px;padding:0 8px;border:2.5px dashed var(--sun-deep);border-radius:10px;background:var(--sun-soft);font:inherit;font-weight:900;color:inherit;text-align:center}
.blank:focus{outline:3px solid var(--accent);border-style:solid}
.blank.good{border:2.5px solid var(--ok-2);background:var(--ok-soft);color:var(--ok-ink)}
.blank.bad{border:2.5px solid var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.bank{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border:2.5px dashed var(--line-2);border-radius:18px;background:var(--surface-2)}
.bank .muted{width:100%;font-weight:800}
.chip{min-height:46px;padding:6px 16px;border-radius:999px;border:2.5px solid var(--line-2);background:var(--surface);font-size:1.1rem;font-weight:800;box-shadow:0 3px 0 var(--line-2);color:var(--ink)}
.chip.used{opacity:.45;box-shadow:none}
.match{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mcol h4{margin:0;font-size:.8rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mi{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 10px;border-radius:16px;border:2.5px solid var(--line-2);background:var(--surface);font-size:1rem;font-weight:700;line-height:1.35;text-align:left;box-shadow:0 3px 0 var(--line-2);color:var(--ink)}
.mb{font-size:1.15rem;font-weight:900;border-style:dashed;border-color:var(--sun-deep);box-shadow:0 3px 0 var(--sun-deep)}
.mi .mn{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg);font-family:var(--f-display);font-size:.95rem;font-weight:800}
.mb .mn:empty{background:var(--sun-soft)}
.ma:not([disabled]){touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mi.sel{border-color:var(--sun-deep);background:var(--sun-soft);box-shadow:0 3px 0 var(--sun-deep);transform:translateY(-2px)}
.mi.sel .mn{background:var(--sun);color:var(--on-sun)}
.mi.pc0,.mi.pc1,.mi.pc2,.mi.pc3,.mi.pc4{border-style:solid;border-color:var(--pc);background:var(--pcs);box-shadow:0 3px 0 var(--pc)}
.mi.pc0 .mn,.mi.pc1 .mn,.mi.pc2 .mn,.mi.pc3 .mn,.mi.pc4 .mn{background:var(--pc);color:#FFFFFF}
.mi.pc0{--pc:#2457D6;--pcs:#DAE9FB}.mi.pc1{--pc:#8146D0;--pcs:#ECE1FB}.mi.pc2{--pc:#0B8574;--pcs:#D2F1EB}.mi.pc3{--pc:#CC2F6D;--pcs:#FCDDE8}.mi.pc4{--pc:#A35505;--pcs:#FAE7CF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mi[class*=" pc"]{--pcs:color-mix(in srgb,var(--pc) 28%,var(--surface))}}
:root[data-theme="dark"] .mi[class*=" pc"]{--pcs:color-mix(in srgb,var(--pc) 28%,var(--surface))}
.mi.good{background:var(--ok-soft);border-color:var(--ok-2);box-shadow:0 3px 0 var(--ok-2)}
.mi.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.mb.over{outline:3px solid var(--sun);outline-offset:1px}
.write{display:flex;flex-direction:column;gap:6px}
.write label{font-weight:900;color:var(--ink-2)}
.write textarea{width:100%;min-height:150px;padding:10px 14px 10px 38px;border-radius:16px;border:2px solid var(--line-2);font-size:1.25rem;font-weight:700;line-height:40px;resize:vertical;
  background-color:var(--surface-2);background-image:linear-gradient(90deg,transparent 24px,var(--margin) 24px,var(--margin) 26px,transparent 26px),repeating-linear-gradient(180deg,transparent 0,transparent 39px,var(--rule) 39px,var(--rule) 40px);background-position:0 0,0 10px;background-attachment:local}
.write textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.checks{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:18px}
.checks li{display:flex;gap:10px;align-items:center;font-weight:700}
.checks .y,.checks .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#FFFFFF;font-size:.9rem}
.checks .y{background:var(--ok)}.checks .n{background:var(--bad)}
.qact{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.qact .sp{flex:1}
.qact .btn.big{flex:1 1 200px}
.qact .btn.hint{min-height:58px;border-radius:18px;padding:0 16px}
.hintbox{display:flex;align-items:flex-end;gap:8px}
.hintbox .robot-svg{width:58px;height:58px}
.hintbox .bubble{margin-bottom:8px}
.fb{border-radius:24px;padding:14px 16px 16px;white-space:pre-line;border:2px solid;font-weight:700;line-height:1.45;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.fb.no{background:var(--bad-soft);border-color:var(--bad-line)}
.fb.info{background:var(--surface-2);border-color:var(--line)}
.fb h4{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1}
.fb.ok h4{color:var(--ok-ink)}.fb.no h4{color:var(--bad-ink)}
.fb h4 i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.fb h4 i svg{width:22px;height:22px}
.fb .ansl b{font-weight:900}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:none;opacity:1}}

/* Kết quả */
.result{position:relative;max-width:620px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:6px}
.result .confetti{position:absolute;inset:0 0 auto;height:200px;pointer-events:none}
.result .confetti i{position:absolute;display:block;border-radius:4px}
.result .robot-svg{width:96px;height:96px;position:relative}
.result .stars.big{margin-top:-6px;position:relative}
.result h2{font-family:var(--f-display);font-size:2.5rem;font-weight:800;margin:0;line-height:1.05}
.result .sub{font-size:.95rem;font-weight:700;color:var(--muted);margin-top:-8px}
.scorecard{width:100%;background:var(--surface);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line-2)}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:0}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.score .big small{font-size:1.6rem;color:var(--muted)}
.score .lab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-weight:800;text-align:left}
.score .pct{background:var(--accent-soft);color:var(--accent-deep);font-size:.82rem;font-weight:900;padding:3px 10px;border-radius:999px}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rstats div{border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;gap:2px}
.rstats b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.rstats span{font-size:.8rem;font-weight:800;line-height:1.2}
.rstats .a{background:var(--ok-soft);color:var(--ok-ink)}.rstats .b{background:var(--sun-soft);color:var(--sun-ink)}.rstats .c{background:var(--bad-soft);color:var(--bad-ink)}
.unlock{width:100%;display:flex;align-items:center;gap:12px;background:var(--m3-soft);border:2px solid var(--m3-line);border-radius:22px;padding:12px 14px;text-align:left}
.unlock .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center}
.unlock .ic svg{width:34px;height:34px}
.unlock b{display:block;font-size:1.02rem;font-weight:900;color:var(--bad-ink)}
.unlock span{font-size:.9rem;font-weight:700}
.racts{width:100%;display:flex;flex-direction:column;gap:10px}
.racts .btn.go{width:100%}
.racts .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.racts .row3 .btn{min-height:52px;padding:4px;font-size:.95rem;line-height:1.15;box-shadow:none}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.review h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.review details{background:var(--surface);border:2px solid var(--line-2);border-radius:20px;padding:12px 14px}
.review summary{cursor:pointer;font-weight:800;line-height:1.4;white-space:pre-line}
.review .ans{color:var(--ok);font-weight:900;white-space:pre-line;margin:10px 0 4px}
.review .ex{color:var(--ink-2);font-size:.92rem;font-weight:700;white-space:pre-line;margin:0}
.remind{width:100%;display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:18px;padding:10px 14px;text-align:left;font-size:.9rem;font-weight:800;color:var(--ok-ink)}
.remind svg{width:22px;height:22px;flex:none}

/* Gửi kết quả */
.send{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:26px;padding:18px;box-shadow:0 4px 0 var(--line-2)}
.send h2{font-family:var(--f-display);font-size:1.8rem;margin:0;line-height:1.1}
.send p{margin:0}
.code{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;font-weight:500;padding:12px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface-2);word-break:break-all;resize:vertical}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:st;position:relative;padding-left:38px;min-height:28px}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}

.foot{margin-top:40px;padding-top:14px;border-top:2px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem;font-weight:700}
.foot .sp{flex:1}

/* Góc giáo viên */
.gv-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.gv-head h2{font-family:var(--f-display);font-size:1.7rem;margin:0;flex:1}
.store-note{font-size:.82rem;color:var(--muted);margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{margin:0;font-family:var(--f-display);font-size:1.25rem}
.box p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;min-width:0}
.form select,.form input,.form textarea,.field{min-height:44px;padding:8px 10px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface-2);max-width:100%}
.form textarea{min-height:70px;width:100%}
.form .grow{flex:1 1 260px}
.checkrow{display:flex;gap:14px;flex-wrap:wrap}
.checkrow label{flex-direction:row;align-items:center;gap:6px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.scroll{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table.mx{border-collapse:collapse;font-size:.82rem;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.mx th{font-weight:600;color:var(--muted);vertical-align:bottom;background:var(--surface-2)}
.mx th.l{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;max-height:150px;white-space:normal;line-height:1.2;padding:8px 4px;min-width:34px}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;z-index:1}
.mx th:first-child{background:var(--surface-2)}
.cell{display:inline-flex;gap:2px}
.cell i{width:9px;height:14px;border-radius:2px;background:var(--line)}
.cell i.T{background:var(--ok)}.cell i.H{background:var(--star)}.cell i.C{background:var(--bad)}
.hs-t td:first-child,.hs-t th:first-child{text-align:left}
.hs-t th{vertical-align:middle;white-space:normal;min-width:70px}
.hs-t tr.sel td{background:var(--accent-soft)}
.lnk{border:0;background:none;padding:0;min-height:32px;font-weight:800;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px}
.prog{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.prog .bar{width:90px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i,.barrow .prog .bar i{display:block;height:100%;background:var(--ok)}
.prog b{min-width:3.2em;text-align:left}
.prog.wide .bar{width:160px}
.barrow.th-row{grid-template-columns:minmax(0,1fr) auto}
.sub{margin:4px 0 0;font-size:1rem}
.wkbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(28px,1fr));gap:6px;height:150px;align-items:end}
.wkbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.75rem;color:var(--muted)}
.wkbars i{display:block;width:100%;max-width:38px;min-height:2px;background:var(--accent);border-radius:6px 6px 0 0}
.wkbars b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:520px){.prog .bar{width:56px}.prog.wide .bar{width:80px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:middle;margin-right:4px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.group{border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line)}
.group h4{margin:0 0 4px;font-size:.92rem}
.group p{margin:0;font-variant-numeric:tabular-nums;font-size:.95rem}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:.88rem}
.barrow .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.barrow .bar i{display:block;height:100%;background:var(--bad)}
.barrow b{font-variant-numeric:tabular-nums;text-align:right}
.cmp{display:flex;gap:18px;flex-wrap:wrap}
.cmp div{display:flex;flex-direction:column}
.cmp b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.item .no{font-family:var(--f-display);font-weight:700;min-width:2.2em}
.item textarea{width:100%;min-height:64px;padding:8px 10px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);font-size:.95rem}
.qprev{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.qprev.off{opacity:.5}
.qprev .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.qprev .hd .sp{flex:1}
.qprev .pp{font-weight:600;white-space:pre-line}
.qprev .ss{white-space:pre-line;padding:6px 10px;border-left:4px solid var(--margin);background:var(--surface-2);border-radius:6px}
.qprev ul{margin:0;padding-left:1.2em}
.qprev li.c{color:var(--ok);font-weight:600}
.qprev .tk{display:inline-block;padding:1px 6px;margin:2px;border-radius:6px;border:1px solid var(--line-2)}
.qprev .tk.c{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.qprev .he{font-size:.85rem;color:var(--muted);white-space:pre-line}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:600}
.tag.warn{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.pend{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;box-shadow:var(--shadow)}
.pend .sp{flex:1}

      { id: "t2b25-12", m: 3, t: "write",

      {"id":"t2b25-dt1","m":3,"t":"fill","p":"Chọn từ ngữ thích hợp trong khung để điền vào chỗ trống.","s":"Trong khu bảo tồn, đàn hươu cao cổ ___ chiếc cổ dài để ăn lá. Chú sư tử ___ trên bãi cỏ, phơi mình dưới nắng. Xa xa, tiếng voi ___ vang cả khu rừng.","b":["rống","bơi lội","vươn","rụt","nằm dài"],"a":[["vươn"],["nằm dài"],["rống"]],"h":"Muốn ăn lá trên cao, hươu làm gì với chiếc cổ? Sư tử phơi nắng trong tư thế nào? Tiếng kêu của voi gọi là gì?","e":"Trong khu bảo tồn, đàn hươu cao cổ **vươn** chiếc cổ dài để ăn lá. Chú sư tử **nằm dài** trên bãi cỏ, phơi mình dưới nắng. Xa xa, tiếng voi **rống** vang cả khu rừng. Mỗi từ đều đúng nghĩa và hợp với hoạt động của từng con vật."},

  var c = PEND.cfg, wk = '';
  for (var i = 1; i <= 35; i++) wk += '<option value="' + i + '"' + (c.tuan === i ? ' selected' : '') + '>Tuần ' + i + '</option>';
  return '<div class="box"><h3>Cài đặt cho cả lớp</h3><p class="muted small">Áp dụng cho mọi máy mở app, sau khi cô bấm “Cập nhật cho cả lớp”.</p><div class="form">' +
    '<label>Tên lớp<input id="set-lop" class="field" value="' + esc(c.lop || '') + '" placeholder="4/11" maxlength="12"></label>' +
    '<label>Sĩ số<input id="set-siso" class="field" type="number" min="5" max="60" value="' + (c.siSo || 35) + '"></label>' +
    '<label>Tuần đang học<select id="set-tuan" class="field"><option value="0"' + (!c.tuan ? ' selected' : '') + '>Tự tính theo lịch (tuần ' + weekNowFor(0) + ')</option>' + wk + '</select></label></div>' +
    '<div class="checkrow"><label class="small"><input type="checkbox" id="set-mokhoa"' + (c.moKhoa ? ' checked' : '') + '> Mở sẵn cả 3 mức cho mọi bài (không cần đạt 2 sao mới lên mức)</label></div>' +
    '<p class="small muted">Lịch tự tính lấy tuần 1 bắt đầu ngày 7/9/2026 và không trừ kì nghỉ Tết. Sau Tết, cô chọn tuần cụ thể cho đúng.</p></div>' +
    '<div class="box"><h3>File app cho học sinh</h3><p class="muted small">Học sinh mở app bằng file này (trên máy tính bảng của lớp, hoặc cô đưa lên một trang lưu trữ web miễn phí để phụ huynh mở). File đã gồm toàn bộ câu hỏi, câu cô giao thêm, câu đã ẩn và cài đặt hiện tại' + (dirty() ? ', kể cả thay đổi chưa giao' : '') + '. Mỗi lần cô giao thêm câu hỏi, cô tải file mới và thay file cũ.</p><div class="qact"><button class="btn pri" data-act="dl-html">Tải file app cho học sinh (.html)</button></div></div>' +
    '<div class="box"><h3>Trên máy này</h3><div class="qact"><button class="btn" data-act="set-pin">Đổi mã PIN</button><button class="btn" data-act="set-wipe">Xoá kết quả học sinh trên máy này</button></div>' +
    (G.confirm === 'wipe' ? '<div class="confirm"><b>Xoá toàn bộ kết quả học sinh lưu trên máy này?</b><span class="small">Kết quả đã nhập vào Góc giáo viên không bị xoá. Nên lấy “mã của máy này” trước khi xoá.</span><div class="qact"><button class="btn" data-act="set-wipe-no">Không xoá</button><button class="btn pri" data-act="set-wipe-yes">Xoá</button></div></div>' : '') + '</div>';
}
function weekNowFor() { var t = DATA.cfg.tuan; DATA.cfg.tuan = 0; var w = weekNow(); DATA.cfg.tuan = t; return w; }
GVCHANGE['set-lop'] = function (el) { PEND.cfg.lop = el.value.trim().slice(0, 12); savePend(); render(); };
GVCHANGE['set-siso'] = function (el) { var n = Math.max(5, Math.min(60, Number(el.value) || 35)); PEND.cfg.siSo = n; savePend(); render(); };
GVCHANGE['set-tuan'] = function (el) { PEND.cfg.tuan = Number(el.value) || 0; savePend(); render(); };
GVCHANGE['set-mokhoa'] = function (el) { PEND.cfg.moKhoa = el.checked; savePend(); render(); };
GVACT['set-pin'] = function () { LS.set('tc4.pin', null); try { localStorage.removeItem('tc4.pin'); } catch (e) { } SS.del('tc4.gvok'); go('gvlock'); };
GVACT['dl-html'] = function () {
  var next = clone(PEND); next.ver = DATA.ver; next.v = 1;
  var html = pageHtml(next);
  saveFile('tram-tu-cau-lop4.html', html, 'text/html', function () { toast('Máy này chưa tải được file. Cô mở app trong Claude hoặc nhờ Claude gửi lại file.'); });
};
GVACT['set-wipe'] = function () { G.confirm = 'wipe'; render(); };
GVACT['set-wipe-no'] = function () { G.confirm = null; render(); };
GVACT['set-wipe-yes'] = function () { S = { cur: null, hs: {} }; saveS(); G.confirm = null; toast('Đã xoá kết quả trên máy này'); render(); };

/* ---------- cập nhật cho cả lớp (tự xuất bản lại trang) ---------- */
function dirty() { return JSON.stringify({ c: PEND.cfg, e: PEND.extra, a: PEND.an }) !== JSON.stringify({ c: DATA.cfg, e: DATA.extra, a: DATA.an }); }
function pendBar() {
  if (!PEND || !dirty()) return '';
  var nNew = 0; Object.keys(PEND.extra).forEach(function (l) { nNew += PEND.extra[l].length; }); Object.keys(DATA.extra).forEach(function (l) { nNew -= DATA.extra[l].length; });
  var parts = []; if (nNew > 0) parts.push(nNew + ' câu mới'); if (JSON.stringify(PEND.an) !== JSON.stringify(DATA.an)) parts.push('đổi câu ẩn'); if (JSON.stringify(PEND.cfg) !== JSON.stringify(DATA.cfg)) parts.push('đổi cài đặt'); if (nNew < 0) parts.push('xoá câu');
  if (G.confirm === 'pub') return '<div class="pend"><span>Cập nhật app cho cả lớp? Trang sẽ tải lại; các máy đang mở app sẽ nhận bản mới.</span><span class="sp"></span><button class="btn sm" data-act="pub-no">Chưa</button><button class="btn sm pri" data-act="pub-yes">Cập nhật</button></div>';
  return '<div class="pend"><span>Thay đổi chưa giao: ' + parts.join(', ') + '</span><span class="sp"></span><button class="btn sm" data-act="pub-undo">Huỷ thay đổi</button><button class="btn sm pri" data-act="pub-ask">Cập nhật cho cả lớp</button></div>';
}
GVACT['pub-ask'] = function () { G.confirm = 'pub'; render(); };
GVACT['pub-no'] = function () { G.confirm = null; render(); };
GVACT['pub-undo'] = function () { PEND = clone(DATA); savePend(); render(); };
function jsonForScript(o) { return JSON.stringify(o).replace(/</g, '\\u003c'); }
function pageHtml(data) {
  var css = document.getElementById('tc-style').textContent, bank = document.getElementById('tc-bank').textContent, main = document.getElementById('tc-main').textContent;
  return SKEL + HEAD + '<style id="tc-style">' + css + '</style>' + SHELL + '<script type="application/json" id="tc-data">' + jsonForScript(data) + '<\/script><script id="tc-bank">' + bank + '<\/script><script id="tc-main">' + main + '<\/script>\n</body></html>';
}
GVACT['pub-yes'] = function () {
  G.confirm = null;
  var next = clone(PEND); next.ver = Date.now(); next.v = 1;
  cap('artifact').then(function (art) {
    if (!art) { pubFallback(next, 'Ở đây chưa cập nhật được app.'); return; }
    SS.set('tc4.gvtab', G.tab); SS.set('tc4.gvok', String(Date.now()));
    art.publish(pageHtml(next)).then(function () {
      try { localStorage.removeItem('tc4.pend'); } catch (e) { }
      toast('Đã cập nhật cho cả lớp');
    }, function (e) {
      var c = e && e.code;
      if (c === 'conflict') return;
      pubFallback(next, c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled' || c === 'consent_required' ? 'Tài khoản đang mở không có quyền sửa app này.' : c === 'too_large' ? 'App quá lớn, cô ẩn bớt câu hỏi rồi thử lại.' : 'Chưa cập nhật được (' + (c || 'lỗi') + '). Cô thử lại sau.');
    });
  });
};
function pubFallback(next, why) {
  showCopy('Chưa cập nhật được cho cả lớp', JSON.stringify({ cfg: next.cfg, extra: next.extra, an: next.an }), why + ' Nếu học sinh dùng file app, cô vào tab Cài đặt bấm “Tải file app cho học sinh” để có file mới đã gồm thay đổi. Hoặc cô mở app trong Claude bằng tài khoản đã tạo app rồi bấm lại “Cập nhật cho cả lớp”, hoặc sao chép đoạn dữ liệu dưới đây gửi cho Claude để cập nhật giúp. Các thay đổi vẫn được giữ trên máy này.');
}

/*__TEST__*/
/* ---------- khởi động ---------- */
if (SS.get('tc4.gvtab') && SS.get('tc4.gvok')) enterGV(); else render();
})();
</script>
</body></html>
